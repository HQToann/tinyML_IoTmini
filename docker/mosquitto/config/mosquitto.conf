# mosquitto.conf - Cấu hình MQTT Broker cục bộ cho dự án IoT TinyML

# Lắng nghe kết nối TCP MQTT chuẩn từ ESP32 trên cổng 1883
listener 1883 0.0.0.0
allow_anonymous true

# Lắng nghe kết nối WebSocket trên cổng 9001 (tùy chọn mở rộng cho Web UI)
listener 9001 0.0.0.0
protocol websockets
allow_anonymous true

# Thiết lập lưu trữ trạng thái bền vững
persistence true
persistence_location /mosquitto/data/

# Nhật ký hoạt động (Logs)
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

