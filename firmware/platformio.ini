; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Cấu hình môi trường vi điều khiển ESP32-C3
[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1 
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
build_flags = 
	-Wno-deprecated-declarations

; Các thư viện phụ thuộc phục vụ phần cứng, TinyML và kết nối IoT
lib_deps = 
	; 1. Thư viện đọc cảm biến gia tốc / con quay hồi chuyển MPU-6050
	adafruit/Adafruit MPU6050 @ ^2.2.6
	adafruit/Adafruit Unified Sensor @ ^1.1.14

	; 2. Thư viện giao tiếp MQTT Client truyền dữ liệu lên máy chủ
	knolleary/PubSubClient @ ^2.8

	; 3. Thư viện xử lý và đóng gói chuỗi JSON
	bblanchon/ArduinoJson @ ^7.0.4

	; 4. Bộ runtime TensorFlow Lite for Microcontrollers (TFLite Micro) tương thích RISC-V ESP32-C3
	spaziochirale/Chirale_TensorFLowLite @ ^2.0.0
